name: Sign Windows build (SignPath)

# Free Authenticode signing for open-source projects via SignPath Foundation.
#
# One-time setup:
#   1. Apply at https://signpath.org/  (open-source projects, free)
#   2. In SignPath, create: Organisation → Project → Signing Policy →
#      Artifact Configuration (root element `<zip-file>` containing the .msi/.exe)
#   3. Install the SignPath GitHub App on this repository
#   4. Add repository secrets / variables:
#        secrets.SIGNPATH_API_TOKEN        – API token with submitter rights
#        vars.SIGNPATH_ORGANIZATION_ID     – SignPath organisation id (GUID)
#        vars.SIGNPATH_PROJECT_SLUG        – e.g. beatmapper
#        vars.SIGNPATH_SIGNING_POLICY_SLUG – e.g. release-signing
#        vars.SIGNPATH_ARTIFACT_CONFIG_SLUG– e.g. windows-installers
#   5. Set repository variable SIGNPATH_ENABLED = true
#
# This job builds Windows, has the installers signed, and replaces the unsigned
# assets on the tag's release.

# Manual only: start a run from the Actions tab ("Run workflow").
# Nothing is built on push, so tags and commits never spend build minutes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (e.g. v0.1.2)"
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  sign:
    name: Build and sign (windows)
    if: vars.SIGNPATH_ENABLED == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate PandaCSS styles
        run: pnpm exec panda codegen --clean

      - name: Build installers (unsigned)
        run: pnpm exec tauri build --bundles msi,nsis

      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path unsigned | Out-Null
          Copy-Item "src-tauri/target/release/bundle/msi/*.msi" unsigned/ -ErrorAction SilentlyContinue
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" unsigned/ -ErrorAction SilentlyContinue
          Get-ChildItem unsigned | Format-Table Name, Length

      # SignPath requires the artifact to be stored as a GitHub workflow artifact.
      - name: Upload unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers-unsigned
          path: unsigned/*

      - name: Submit signing request
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Publish signed installers to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ inputs.tag }}"
          if (-not $tag) { throw "Run this workflow with the 'tag' input set to a release tag, e.g. v0.1.2" }
          $exists = gh release view $tag 2>$null
          if (-not $exists) {
            gh release create $tag --draft --title "Beatmapper $tag" --notes "Desktop builds of Beatmapper."
          }
          Get-ChildItem signed -Recurse -File | ForEach-Object {
            Write-Host "Uploading $($_.Name)"
            gh release upload $tag $_.FullName --clobber
          }
