name: Build Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}

    env:
      # --- macOS signing + notarisation (optional) -------------------------
      # When these secrets are present Tauri signs and notarises the .app/.dmg
      # automatically. When absent the build is unsigned (Gatekeeper warns).
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      # Falls back to an ad-hoc signature when no certificate is configured,
      # which avoids the misleading "app is damaged" Gatekeeper dialog.
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # --- Windows signing via Azure Trusted Signing (optional) ------------
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TS_ENDPOINT: ${{ secrets.AZURE_TS_ENDPOINT }}
      AZURE_TS_ACCOUNT: ${{ secrets.AZURE_TS_ACCOUNT }}
      AZURE_TS_PROFILE: ${{ secrets.AZURE_TS_PROFILE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Rust is needed twice: the wasm32 target compiles our audio/pattern
      # modules via wasm-pack, and the host toolchain compiles the Tauri shell.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # PandaCSS generates `styled-system`, which every component imports.
      # It is gitignored, so it must be regenerated before any build.
      - name: Generate PandaCSS styles
        run: pnpm exec panda codegen --clean

      # Wire Authenticode signing for Windows when Azure Trusted Signing
      # credentials are configured. Patches the config just for this runner.
      - name: Configure Windows signing
        if: matrix.platform == 'windows-latest' && env.AZURE_TS_ENDPOINT != ''
        shell: pwsh
        run: |
          cargo install trusted-signing-cli --locked
          $cfg = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $cfg.bundle | Add-Member -NotePropertyName windows -NotePropertyValue ([pscustomobject]@{
            digestAlgorithm = "sha256"
            timestampUrl    = "http://timestamp.acs.microsoft.com"
            signCommand     = "trusted-signing-cli -e $env:AZURE_TS_ENDPOINT -a $env:AZURE_TS_ACCOUNT -c $env:AZURE_TS_PROFILE -d Beatmapper %1"
          }) -Force
          $cfg | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Beatmapper v__VERSION__'
          releaseBody: |
            Desktop builds of Beatmapper.

            - **Windows** — `.msi` installer or `.exe` setup
            - **macOS** — `.dmg` disk image
            - **Linux** — `.deb` / `.AppImage`
          releaseDraft: true
          prerelease: false
