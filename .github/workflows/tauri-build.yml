name: Build Desktop App

# Manual only: start a run from the Actions tab ("Run workflow").
# Nothing is built on push, so tags and commits never spend build minutes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (e.g. v0.1.2)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}

    env:
      # --- Windows self-signed certificate (free, optional) ----------------
      WINDOWS_SELF_SIGN_PFX: ${{ secrets.WINDOWS_SELF_SIGN_PFX }}
      WINDOWS_SELF_SIGN_PASSWORD: ${{ secrets.WINDOWS_SELF_SIGN_PASSWORD }}

      # --- Windows signing via Azure Trusted Signing (optional) ------------
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TS_ENDPOINT: ${{ secrets.AZURE_TS_ENDPOINT }}
      AZURE_TS_ACCOUNT: ${{ secrets.AZURE_TS_ACCOUNT }}
      AZURE_TS_PROFILE: ${{ secrets.AZURE_TS_PROFILE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Rust is needed twice: the wasm32 target compiles our audio/pattern
      # modules via wasm-pack, and the host toolchain compiles the Tauri shell.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # PandaCSS generates `styled-system`, which every component imports.
      # It is gitignored, so it must be regenerated before any build.
      - name: Generate PandaCSS styles
        run: pnpm exec panda codegen --clean

      # Configure Authenticode signing for Windows.
      # Prefers a self-signed certificate (free) and falls back to Azure
      # Trusted Signing when those credentials are present instead.
      # Only define the APPLE_* variables when a certificate secret exists.
      # An empty APPLE_CERTIFICATE makes Tauri attempt a PKCS#12 import and
      # fail, so ad-hoc signing is selected explicitly instead.
      - name: Configure macOS signing
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CERT" ]; then
            {
              echo "APPLE_CERTIFICATE=$CERT"
              echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
              echo "APPLE_ID=$APPLE_ID_SECRET"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD_SECRET"
              echo "APPLE_TEAM_ID=$TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "Signing with Developer ID and notarising."
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "No certificate configured: using an ad-hoc signature."
          fi

      - name: Configure Windows signing
        if: matrix.platform == 'windows-latest' && (env.WINDOWS_SELF_SIGN_PFX != '' || env.AZURE_TS_ENDPOINT != '')
        shell: pwsh
        run: |
          $cfg = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json

          if ($env:WINDOWS_SELF_SIGN_PFX) {
            Write-Host "Using self-signed certificate"
            $pfx = Join-Path $env:RUNNER_TEMP 'beatmapper-selfsigned.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SELF_SIGN_PFX))
            "WINDOWS_SELF_SIGN_PFX_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append
            $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/sign-windows.ps1'
            $signCommand = "pwsh -NoProfile -ExecutionPolicy Bypass -File `"$script`" %1"
          }
          else {
            Write-Host "Using Azure Trusted Signing"
            cargo install trusted-signing-cli --locked
            $signCommand = "trusted-signing-cli -e $env:AZURE_TS_ENDPOINT -a $env:AZURE_TS_ACCOUNT -c $env:AZURE_TS_PROFILE -d Beatmapper %1"
          }

          $cfg.bundle | Add-Member -NotePropertyName windows -NotePropertyValue ([pscustomobject]@{
            digestAlgorithm = "sha256"
            timestampUrl    = "http://timestamp.digicert.com"
            signCommand     = $signCommand
          }) -Force
          $cfg | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json
          Write-Host "signCommand = $signCommand"

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || 'v__VERSION__' }}
          releaseName: 'Beatmapper v__VERSION__'
          releaseBody: |
            Desktop builds of Beatmapper.

            - **Windows** — `.msi` installer or `.exe` setup
            - **macOS** — `.dmg` disk image
            - **Linux** — `.deb` / `.AppImage`
          releaseDraft: true
          prerelease: false
