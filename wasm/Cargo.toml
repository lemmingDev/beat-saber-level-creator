[workspace]
resolver = "2"
members = [
    "shared",
    "audio-analysis",
    "pattern-generation",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Beatmapper Contributors"]

[workspace.dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1"
wee_alloc = "0.4"
js-sys = "0.3"
rubato = "0.15"
hound = "3.5"
realfft = "3.5"
getrandom = { version = "0.2", features = ["js"] }
ndarray = "0.16"
num-traits = "0.2"
